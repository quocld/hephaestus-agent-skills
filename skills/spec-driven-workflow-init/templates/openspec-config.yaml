schema: spec-driven

context: |
  {{PROJECT_NAME}} — short description.
  Source of truth for product: <docs path / wiki url>.
  Tracking: docs/build-plan.md.
  Conventions: root CLAUDE.md.
  Stack: {{BE_STACK}}.
  When source-of-truth docs conflict with legacy briefs, the source-of-truth wins.

rules:
  proposal:
    - Link every item to a build-plan row or external ticket
    - Mark unresolved choices as PENDING; never tick [x] in Phase A while item sits in Defer
    - Defer items MUST end with an arrow owner: → <change-id> | → build-plan §X | → TICKET-id
  specs:
    - Use SHALL/MUST; scenarios use #### with WHEN/THEN
    - One capability per spec file under specs/<capability>/spec.md
  tasks:
    - Phase A = decisions (must all be [x] before Phase B starts)
    - Phase B = deliverables (BE, FE, ops)
    - Phase C = verify (typecheck/lint/build/runtime/code-review)
    - Build-plan row stays [~] until every Defer has an owner; only ship → [x] when proposal scope is fully delivered

modules:
  # Customise to your project. Examples:
  # - id: M1
  #   name: Auth & Onboarding
  # - id: billing
  #   name: Billing & Subscriptions
